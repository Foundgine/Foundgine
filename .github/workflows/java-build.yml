  # ------------------------------------------------------------
  # 2d. Penetration gate (aggregates every penetration job)
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # 2e. Live MCP protocol fuzz against the running Java MCP server
  # ------------------------------------------------------------
  java-security-live-mcp-fuzz:
    name: Java Security — live MCP protocol fuzz
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Build the Advanced sample and its dependencies
        run: |
          set -euo pipefail
          mvn -f src/java/pom.xml --batch-mode --no-transfer-progress -q \
            -Dgpg.skip=true -DskipTests \
            -pl samples/foundgine-supply-chain-advanced -am install

      - name: Start the MCP server
        run: |
          set -euo pipefail
          mvn -f src/java/samples/foundgine-supply-chain-advanced/pom.xml --batch-mode --no-transfer-progress -q \
            exec:java -Dexec.mainClass=com.foundgine.samples.supplychain.advanced.mcp.AdvancedMcpServer \
            > mcp-server.log 2>&1 &
          echo $! > mcp-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4783/health >/dev/null; then echo "MCP server ready"; exit 0; fi
            sleep 2
          done
          echo "::error::The Java MCP server did not become ready."
          cat mcp-server.log || true
          exit 1

      - name: MCP protocol fuzz (malformed and authority-injection corpus)
        env:
          FOUNDGINE_TARGET_URL: http://localhost:4783/mcp
        run: bash src/java/security/pentest/mcp-protocol-fuzz.sh

      - name: Server log
        if: always()
        run: cat mcp-server.log || true

      - name: Stop the MCP server
        if: always()
        run: kill "$(cat mcp-server.pid)" 2>/dev/null || true

  java-security-penetration-gate:
    name: java-security-penetration-gate
    if: always()
    needs:
      - java-security-semantic-penetration
      - java-security-adversarial
      - java-security-penetration
      - java-security-intent-redteam
      - java-security-live-mcp-fuzz
      - java-postgres-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every penetration job to pass
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Penetration job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A penetration job finished with result '$result'."
              exit 1
            fi
          done
          echo "All penetration jobs passed."

  # ------------------------------------------------------------
  # 3. PostgreSQL / Docker integration and E2E tests
  # ------------------------------------------------------------
  java-postgres-e2e:
    name: Java Sweep — PostgreSQL, Redis and every security test
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Verify Java and Maven
        run: |
          set -euo pipefail
          java -version
          javac -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          if [[ "$JAVA_MAJOR" != "${JAVA_VERSION}" ]]; then
            echo "::error::Expected Java ${JAVA_VERSION}, but the runtime reports ${JAVA_MAJOR:-unknown}."
            exit 1
          fi
          mvn --version

      - name: Verify Docker availability
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Verify PostgreSQL container image availability
        run: |
          set -euo pipefail
          docker pull postgres:17

      # Without these services the PostgreSQL and Redis tests (several are security tests) skip
      # themselves, so the job would be green while proving nothing.
      - name: Start PostgreSQL 17 and Redis 7
        env:
          POSTGRES_HOST_PORT: "55437"
          REDIS_HOST_PORT: "56382"
        run: |
          set -euo pipefail
          docker compose -p foundgine-java-pg -f docker-compose.postgres.yml up -d --wait postgres
          docker compose -p foundgine-java-redis -f docker-compose.redis.yml up -d --wait redis

      # AdvancedPostgres16SchemaIntegrationTest asserts a 16.x server, so it needs its own
      # PostgreSQL 16 instance; the compose service above is PostgreSQL 17 (pgvector).
      - name: Start PostgreSQL 16
        run: |
          set -euo pipefail
          docker run -d --name foundgine-java-pg16 \
            -e POSTGRES_DB=foundgine_e2e \
            -e POSTGRES_USER=foundgine \
            -e POSTGRES_PASSWORD=foundgine \
            -p 55438:5432 \
            --health-cmd "pg_isready -U foundgine -d foundgine_e2e" \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:16
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' foundgine-java-pg16)"
            [[ "$status" == "healthy" ]] && break
            sleep 2
          done
          [[ "$status" == "healthy" ]] || { docker logs foundgine-java-pg16; echo "::error::PostgreSQL 16 did not become healthy."; exit 1; }

      - name: Run PostgreSQL integration and E2E tests
        env:
          FOUNDGINE_POSTGRES_CONNECTION_STRING: jdbc:postgresql://localhost:55437/foundgine_e2e?user=foundgine&password=foundgine
          FOUNDGINE_TEST_PG_URL: jdbc:postgresql://localhost:55437/foundgine_e2e?user=foundgine&password=foundgine
          FOUNDGINE_JDBC_URL: jdbc:postgresql://localhost:55437/foundgine_e2e
          FOUNDGINE_JDBC_USER: foundgine
          FOUNDGINE_JDBC_PASSWORD: foundgine
          FOUNDGINE_JPA_POSTGRES_URL: jdbc:postgresql://localhost:55437/foundgine_e2e
          FOUNDGINE_JPA_POSTGRES_USER: foundgine
          FOUNDGINE_JPA_POSTGRES_PASSWORD: foundgine
          FOUNDGINE_POSTGRES16_JDBC_URL: jdbc:postgresql://localhost:55438/foundgine_e2e
          FOUNDGINE_POSTGRES16_USER: foundgine
          FOUNDGINE_POSTGRES16_PASSWORD: foundgine
          FOUNDGINE_REDIS: 127.0.0.1:56382
        run: |
          set -euo pipefail
          CANONICAL="$(mvn -f src/java/pom.xml --batch-mode --no-transfer-progress -q -N help:evaluate -Dexpression=revision -DforceStdout)"
          if [[ -z "$CANONICAL" || "$CANONICAL" == "null object or invalid expression" ]]; then
            echo "::error::Unable to read <revision> from src/java/pom.xml."
            exit 1
          fi
          echo "Canonical version: $CANONICAL"
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            -Drevision="${CANONICAL}-ci.${GITHUB_RUN_NUMBER}" \
            verify

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-postgres-e2e-reports
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop PostgreSQL and Redis
        if: always()
        run: |
          docker compose -p foundgine-java-pg -f docker-compose.postgres.yml down --volumes --remove-orphans || true
          docker compose -p foundgine-java-redis -f docker-compose.redis.yml down --volumes --remove-orphans || true
          docker rm -f foundgine-java-pg16 || true

      - name: Verify no security test was skipped or left unrun
        if: always()
        run: python3 tools/ci/verify_security_tests.py --language java --reports src/java

  # ------------------------------------------------------------
  # 4. Publish Java libraries to Maven Central
  # ------------------------------------------------------------
  publish-maven:
    name: Publish Java Packages to Maven Central
    runs-on: ubuntu-latest
    environment: production

    needs:
      - java-build
      - java-security-penetration-gate
      - java-postgres-e2e

    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "::error::Unable to determine release version."
            exit 1
          fi

          CANONICAL="$(mvn -f src/java/pom.xml --batch-mode --no-transfer-progress -q -N help:evaluate -Dexpression=revision -DforceStdout)"
          if [[ -z "$CANONICAL" || "$CANONICAL" == "null object or invalid expression" ]]; then
            echo "::error::Unable to read <revision> from src/java/pom.xml."
            exit 1
          fi
          echo "Canonical version: $CANONICAL"

          if [[ "$VERSION" != "$CANONICAL" ]]; then
            echo "::error::Release tag v$VERSION does not match <revision> $CANONICAL in src/java/pom.xml."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Foundgine Java version: $VERSION"

      - name: Set up Java 27 and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      - name: Verify GPG signing secrets
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [[ -z "$GPG_PASSPHRASE" ]]; then
            echo "::error::MAVEN_GPG_PASSPHRASE is empty or unavailable."
            exit 1
          fi

          if [[ "$GPG_PRIVATE_KEY" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::GPG private key is not in ASCII-armored format."
            exit 1
          fi

          echo "GPG signing secrets are configured."

      - name: Validate GPG private key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          TEMP_GNUPGHOME="$(mktemp -d)"
          chmod 700 "$TEMP_GNUPGHOME"
          trap 'rm -rf "$TEMP_GNUPGHOME"' EXIT

          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --homedir "$TEMP_GNUPGHOME" \
                --batch \
                --import

          if ! gpg --homedir "$TEMP_GNUPGHOME" \
                   --batch \
                   --list-secret-keys |
                   grep -q 'sec'; then
            echo "::error::No usable secret key was imported."
            exit 1
          fi

          echo "GPG private key was successfully imported."

      - name: Verify Maven Central credentials
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$MAVEN_USERNAME" ]]; then
            echo "::error::MAVEN_USERNAME is empty or unavailable."
            exit 1
          fi

          if [[ -z "$MAVEN_CENTRAL_TOKEN" ]]; then
            echo "::error::MAVEN_CENTRAL_TOKEN is empty or unavailable."
            exit 1
          fi

          echo "Maven Central credentials are configured."

      - name: Verify Maven Central settings
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$HOME/.m2/settings.xml"

          if [[ ! -f "$SETTINGS_FILE" ]]; then
            echo "::error::Maven settings.xml was not generated."
            exit 1
          fi

          python3 - "$SETTINGS_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          servers = root.find("{*}servers")

          if servers is None:
              raise SystemExit("No Maven servers configuration found.")

          central = None

          for server in servers.findall("{*}server"):
              server_id = server.find("{*}id")
              if server_id is not None and server_id.text == "central":
                  central = server
                  break

          if central is None:
              raise SystemExit("Maven server ID 'central' was not found.")

          username = central.find("{*}username")
          password = central.find("{*}password")

          if username is None or not username.text:
              raise SystemExit("Central username configuration is missing.")

          if password is None or not password.text:
              raise SystemExit("Central password configuration is missing.")

          print("Maven Central server configuration is present.")
          PY

      - name: Verify Java and Maven
        run: |
          set -euo pipefail
          java -version
          javac -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          if [[ "$JAVA_MAJOR" != "${JAVA_VERSION}" ]]; then
            echo "::error::Expected Java ${JAVA_VERSION}, but the runtime reports ${JAVA_MAJOR:-unknown}."
            exit 1
          fi
          mvn --version

      - name: Build and publish Foundgine Java libraries
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Pcentral-publish \
            -Drevision="${{ steps.version.outputs.version }}" \
            -Dgpg.skip=false \
            -Dgpg.signer=bc \
            -Dgpg.keyEnvName=MAVEN_GPG_KEY \
            -Dgpg.passphraseEnvName=MAVEN_GPG_PASSPHRASE \
            -pl foundgine-core,foundgine-runtime,foundgine-providers,foundgine-extensions \
            -am \
            -DskipTests \
            deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Report published version
        if: success()
        run: |
          echo "Successfully published Foundgine Java version ${{ steps.version.outputs.version }}"

  # ------------------------------------------------------------
  # 5. Publish GitHub Wiki
  # ------------------------------------------------------------
  publish-wiki:
    name: Publish GitHub Wiki
    runs-on: ubuntu-latest
    environment: production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "docs/wiki" ]]; then
            echo "::error::docs/wiki directory does not exist."
            exit 1
          fi

          if [[ ! -f "docs/wiki/index.md" ]]; then
            echo "::error::docs/wiki/index.md does not exist."
            exit 1
          fi

      - name: Validate Wiki token
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WIKI_TOKEN:-}" ]]; then
            echo "::error::GITHUB_TOKEN is empty or unavailable."
            exit 1
          fi

      - name: Clone GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            /tmp/foundgine-wiki

      - name: Synchronize Wiki documentation
        shell: bash
        run: |
          set -euo pipefail

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='index.md' \
            docs/wiki/ /tmp/foundgine-wiki/

          cp docs/wiki/index.md /tmp/foundgine-wiki/Home.md

      - name: Commit and publish Wiki
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/foundgine-wiki

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "Update Foundgine Wiki from docs/wiki"
            git push
          else
            echo "Wiki is already up to date."
          fi
