name: java Build, Test & Pack

on:
  push:
    branches:
      - main
      - java
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '27'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

jobs:

  # ------------------------------------------------------------
  # 1. Build and run unit tests
  # ------------------------------------------------------------
  java-build:
    name: Java Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release tag points to main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          }

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Verify Java and Maven
        run: |
          set -euo pipefail
          java -version
          javac -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          if [[ "$JAVA_MAJOR" != "${JAVA_VERSION}" ]]; then
            echo "::error::Expected Java ${JAVA_VERSION}, but the runtime reports ${JAVA_MAJOR:-unknown}."
            exit 1
          fi
          mvn --version

      - name: Build and run unit tests
        run: |
          set -euo pipefail
          CANONICAL="$(mvn -f src/java/pom.xml --batch-mode --no-transfer-progress -q -N help:evaluate -Dexpression=revision -DforceStdout)"
          if [[ -z "$CANONICAL" || "$CANONICAL" == "null object or invalid expression" ]]; then
            echo "::error::Unable to read <revision> from src/java/pom.xml."
            exit 1
          fi
          echo "Canonical version: $CANONICAL"
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            -Drevision="${CANONICAL}-ci.${GITHUB_RUN_NUMBER}" \
            clean package

      - name: Upload Maven build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-build-reports
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------
  # 2. Security and penetration tests
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # 2a. Semantic boundary penetration tests (core, warrants, red-team harness)
  # ------------------------------------------------------------
  java-security-semantic-penetration:
    name: Java Security Penetration Test — Foundgine Semantic Boundary
    runs-on: ubuntu-latest
    needs: java-build
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: 'src/java/**/pom.xml'

      - name: Verify Java and Maven
        run: |
          set -euo pipefail
          java -version
          javac -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          if [[ "$JAVA_MAJOR" != "${JAVA_VERSION}" ]]; then
            echo "::error::Expected Java ${JAVA_VERSION}, but the runtime reports ${JAVA_MAJOR:-unknown}."
            exit 1
          fi
          mvn --version

      - name: Run penetration tests
        run: |
          set -euo pipefail
          CANONICAL="$(mvn -f src/java/pom.xml --batch-mode --no-transfer-progress -q -N help:evaluate -Dexpression=revision -DforceStdout)"
          if [[ -z "$CANONICAL" || "$CANONICAL" == "null object or invalid expression" ]]; then
            echo "::error::Unable to read <revision> from src/java/pom.xml."
            exit 1
          fi
          echo "Canonical version: $CANONICAL"
          mvn \
            -f src/java/pom.xml \
            --batch-mode \
            --no-transfer-progress \
            --errors \
            -Dgpg.skip=true \
            -Drevision="${CANONICAL}-ci.${GITHUB_RUN_NUMBER}" \
            -pl security/foundgine-redteam \
            -am \
            -Dtest='SemanticBoundaryPenetrationParityTest,PlanIntegrityPenetrationParityTest,SecurityProofRailsPenetrationParityTest,CacheModelAndPredicatePenetrationParityTest,ResourceExhaustionPenetrationParityTest,GraphAndResourceDoSPenetrationParityTest,JsonAndMcpBoundaryPenetrationParityTest,CryptographicAndIdentityPenetrationParityTest,WarrantTrustBoundaryPenetrationParityTest,SecurityWarrantGuardRailsPenetrationParityTest,IntentParserHardeningParityTest,TransportAndSecretLeakageParityTest,RedTeamHarnessPenetrationTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            verify

      - name: Upload penetration test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-security-semantic-penetration-results
          path: |
            src/java/**/target/surefire-reports/**
            src/java/**/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify penetration tests executed
        shell: bash
        run: |
          set -euo pipefail
          # Guard against a silent zero-test pass: every expected class must have a report with executed tests.
          python3 - SemanticBoundaryPenetrationParityTest PlanIntegrityPenetrationParityTest SecurityProofRailsPenetrationParityTest CacheModelAndPredicatePenetrationParityTest ResourceExhaustionPenetrationParityTest GraphAndResourceDoSPenetrationParityTest JsonAndMcpBoundaryPenetrationParityTest CryptographicAndIdentityPenetrationParityTest WarrantTrustBoundaryPenetrationParityTest SecurityWarrantGuardRailsPenetrationParityTest IntentParserHardeningParityTest TransportAndSecretLeakageParityTest RedTeamHarnessPenetrationTest <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          failed = False
          for cls in sys.argv[1:]:
              files = glob.glob(f"src/java/**/target/surefire-reports/TEST-*{cls}.xml", recursive=True)
              if not files:
                  print(f"::error::No surefire report found for {cls}; it did not run.")
                  failed = True
                  continue
              tests = skipped = 0
              for f in files:
                  root = ET.parse(f).getroot()
                  tests += int(root.get("tests", 0))
                  skipped += int(root.get("skipped", 0))
              print(f"{cls}: {tests} tests, {skipped} skipped")
              if tests == 0 or skipped == tests:
                  print(f"::error::{cls} executed no tests.")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

