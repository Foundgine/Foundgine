  # ============================================================
  # Security gate
  # ============================================================
  security-gate:
    name: Security Gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # ============================================================
  # Publish NuGet packages
  # ============================================================
  publish-nuget:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-pack
      - unit-tests
      - supplychain-sample-tests
      - supplychain-semantic-sample-tests
      - integration-tests
      - redis-integration-tests
      - benchmark-build-hotchocolate
      - benchmark-build-foundgine
      - security-penetration-gate
      - security-gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(artifacts/nuget/*.nupkg)

          expected_packages=(
            "Foundgine.Core"
            "Foundgine.Runtime"
            "Foundgine.Providers"
            "Foundgine.Extensions"
          )

          if [[ "${#packages[@]}" -ne "${#expected_packages[@]}" ]]; then
            echo "ERROR: Expected exactly four packages, found ${#packages[@]}."
            exit 1
          fi

          for package in "${packages[@]}"; do
            unzip -t "$package" >/dev/null
            echo "Validated: $package"
          done

          for expected in "${expected_packages[@]}"; do
            matches=(artifacts/nuget/"${expected}".[0-9]*.nupkg)

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "ERROR: Expected exactly one ${expected} package."
              exit 1
            fi
          done

          providers_packages=(artifacts/nuget/Foundgine.Providers.[0-9]*.nupkg)

          if [[ "${#providers_packages[@]}" -ne 1 ]]; then
            echo "ERROR: Expected exactly one Foundgine.Providers package."
            exit 1
          fi

          providers_package="${providers_packages[0]}"

          entries="$(unzip -Z1 "$providers_package")"
          required_assets=(
            "lib/net10.0/Foundgine.Providers.Orm.dll"
            "lib/net10.0/Foundgine.Providers.EntityFrameworkCore.dll"
            "lib/net10.0/Foundgine.Providers.Redis.dll"
            "lib/net10.0/Foundgine.Providers.AgentFramework.dll"
            "lib/net10.0/Foundgine.Providers.PostgresVector.dll"
            "lib/net10.0/Foundgine.Providers.Elasticsearch.dll"
            "analyzers/dotnet/cs/Foundgine.Providers.Aot.Generator.dll"
            "analyzers/dotnet/cs/Foundgine.Providers.Orm.Generator.dll"
          )
          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq "$asset" <<< "$entries"; then
              echo "ERROR: Required Providers asset is missing: $asset"
              exit 1
            fi
          done

          nuspec="$(unzip -p "$providers_package" Foundgine.Providers.nuspec)"
          python3 - "$nuspec" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.fromstring(sys.argv[1])
          dependencies = {item.attrib.get("id", "") for item in root.iter()
                          if item.tag.rsplit("}", 1)[-1] == "dependency"}
          required = {"Microsoft.EntityFrameworkCore", "Microsoft.EntityFrameworkCore.Relational"}
          missing = sorted(required - dependencies)
          if missing:
              raise SystemExit("Missing EF Core dependencies: " + ", ".join(missing))
          PY

          echo "OK: all four expected packages validated"
          echo "OK: EF Core/ORM runtime assemblies and both analyzers present"
          echo "OK: EF Core dependencies declared in Providers nuspec"
          echo "Downloaded NuGet packages validated."

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Foundgine

      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(artifacts/nuget/*.nupkg)

          if [[ "${#packages[@]}" -ne 4 ]]; then
            echo "ERROR: Expected exactly four packages to publish, found ${#packages[@]}."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

          echo "NuGet publishing completed."
