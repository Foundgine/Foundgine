  # ============================================================
  # PostgreSQL integration tests
  # ============================================================
  integration-tests:
    needs:
      - build-pack
    name: Integration Tests — PostgreSQL 17
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker daemon for Testcontainers
        shell: bash
        run: |
          set -euo pipefail
          echo "DOCKER_HOST=$DOCKER_HOST"
          if [[ ! -S /var/run/docker.sock ]]; then
            echo "ERROR: Docker socket /var/run/docker.sock is not available."
            exit 1
          fi
          docker version
          docker info
          docker compose version

      - name: Restore
        run: dotnet restore src/csharp/Foundgine.sln

      - name: Build
        run: dotnet build src/csharp/Foundgine.sln --no-restore --configuration Release

      - name: Start PostgreSQL 17
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml down -v --remove-orphans || true
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            up -d --wait postgres

      - name: Verify PostgreSQL 17
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            exec -T postgres \
            psql \
              -U foundgine \
              -d foundgine_e2e \
              -c 'select version();'

      - name: Run PostgreSQL E2E
        run: |
          dotnet test \
            src/csharp/tests/Foundgine.E2E.Tests/Foundgine.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Foundgine.E2E.Tests" \
            --logger "console;verbosity=normal"

      - name: Run PostgreSQL Event Store
        run: |
          dotnet test \
            src/csharp/tests/Foundgine.EventStore.Tests/Foundgine.EventStore.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Foundgine.EventStore.Tests" \
            --logger "console;verbosity=normal"

      - name: PostgreSQL diagnostics on failure
        if: failure()
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        env:
          POSTGRES_HOST_PORT: "55432"
        run: |
          docker compose -p foundgine-e2e -f docker-compose.postgres.yml \
            down \
            --volumes \
            --remove-orphans

  # ============================================================
  # Redis provider integration tests
  # ============================================================
  redis-integration-tests:
    needs:
      - build-pack
    name: Integration Tests — Redis 7
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          echo "DOCKER_HOST=$DOCKER_HOST"
          if [[ ! -S /var/run/docker.sock ]]; then
            echo "ERROR: Docker socket /var/run/docker.sock is not available."
            exit 1
          fi
          docker version
          docker info
          docker compose version

      - name: Restore solution
        run: dotnet restore src/csharp/Foundgine.sln

      # Explicitly restore the renamed test project.
      - name: Restore Redis test project
        working-directory: src/csharp
        run: |
          dotnet restore \
            tests/Foundgine.Redis.Tests/Foundgine.Redis.Tests.csproj \
            --force

      - name: Build
        run: dotnet build src/csharp/Foundgine.sln --no-restore --configuration Release

      - name: Start Redis 7
        env:
          REDIS_HOST_PORT: "56379"
        run: |
          docker compose -p foundgine-redis -f docker-compose.redis.yml down --remove-orphans || true
          docker compose -p foundgine-redis -f docker-compose.redis.yml up -d --wait redis

      - name: Verify Redis
        run: |
          docker compose -p foundgine-redis -f docker-compose.redis.yml exec -T redis redis-cli ping

      - name: Run Redis provider tests
        working-directory: src/csharp
        env:
          FOUNDGINE_REDIS: "127.0.0.1:56379"
        run: |
          dotnet test \
            tests/Foundgine.Redis.Tests/Foundgine.Redis.Tests.csproj \
            --no-restore \
            --configuration Release \
            --logger "console;verbosity=normal"

      - name: Redis diagnostics on failure
        if: failure()
        run: |
          docker compose -p foundgine-redis -f docker-compose.redis.yml logs --no-color redis

      - name: Stop Redis
        if: always()
        run: |
          docker compose -p foundgine-redis -f docker-compose.redis.yml down --volumes --remove-orphans

  # ============================================================
  # Performance smoke — Hot Chocolate + EF Core
  # ============================================================
  benchmark-build-hotchocolate:
    name: Performance Smoke — Hot Chocolate + EF Core
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmark projects
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/HotChocolate.CoffeeBeanery.BenchmarkApi/HotChocolate.CoffeeBeanery.BenchmarkApi.csproj"
          )

          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      - name: Build benchmark projects
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/HotChocolate.CoffeeBeanery.BenchmarkApi/HotChocolate.CoffeeBeanery.BenchmarkApi.csproj"
          )

          for project in "${projects[@]}"; do
            echo "Building $project"
            dotnet build "$project" --no-restore --configuration Release
          done

      - name: Pull PostgreSQL image with retry
        shell: bash
        run: |
          set -euo pipefail

          image="postgres:17-alpine"
          max_attempts=6

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Pulling $image (attempt $attempt/$max_attempts)..."

            if docker pull "$image"; then
              echo "Successfully pulled $image."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "Docker registry pull failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Unable to pull $image after $max_attempts attempts." >&2
          exit 1

      - name: Run performance smoke test
        shell: bash
        env:
          COFFEEBEANERY_CUSTOMERS: "1"
          COFFEEBEANERY_RELATIONSHIPS_PER_CUSTOMER: "4"
          COFFEEBEANERY_CONTRACTS_PER_RELATIONSHIP: "3"
          COFFEEBEANERY_TRANSACTIONS_PER_CONTRACT: "4"
          BENCHMARK_WARMUP_SECONDS: "1"
          BENCHMARK_DURATION_SECONDS: "1"
          BENCHMARK_REQUEST_TIMEOUT_SECONDS: "5"
          BENCHMARK_READINESS_TIMEOUT_SECONDS: "120"
          BENCHMARK_RESET_TIMEOUT_SECONDS: "30"
          BENCHMARK_CONCURRENCY: "1"
          BENCHMARK_BATCH_SIZES: "1"
          BENCHMARK_FAIL_ON_ERRORS: "true"
          POSTGRES_HOST_PORT: "55433"
        run: |
          set -euo pipefail

          COMPOSE=src/csharp/benchmarks/CoffeeBeanery.Performance/docker-compose.benchmark.yml
          PROJECT=foundgine-performance-smoke-hc

          cleanup() {
            docker compose -p "$PROJECT" -f "$COMPOSE" down -v --remove-orphans || true
          }

          trap cleanup EXIT
          cleanup

          docker compose -p "$PROJECT" -f "$COMPOSE" up -d --build postgres database hotchocolate
          docker compose -p "$PROJECT" -f "$COMPOSE" up --wait hotchocolate

          docker compose -p "$PROJECT" -f "$COMPOSE" run --rm --no-deps \
            -e BENCHMARK_TARGET_NAME="Hot Chocolate + EF Core" \
            -e BENCHMARK_TARGET_URL="http://hotchocolate:4300/graphql" \
            -e BENCHMARK_WARMUP_SECONDS="$BENCHMARK_WARMUP_SECONDS" \
            -e BENCHMARK_DURATION_SECONDS="$BENCHMARK_DURATION_SECONDS" \
            -e BENCHMARK_REQUEST_TIMEOUT_SECONDS="$BENCHMARK_REQUEST_TIMEOUT_SECONDS" \
            -e BENCHMARK_READINESS_TIMEOUT_SECONDS="$BENCHMARK_READINESS_TIMEOUT_SECONDS" \
            -e BENCHMARK_RESET_TIMEOUT_SECONDS="$BENCHMARK_RESET_TIMEOUT_SECONDS" \
            -e BENCHMARK_CONCURRENCY="$BENCHMARK_CONCURRENCY" \
            -e BENCHMARK_BATCH_SIZES="$BENCHMARK_BATCH_SIZES" \
            -e BENCHMARK_FAIL_ON_ERRORS="$BENCHMARK_FAIL_ON_ERRORS" \
            -e BENCHMARK_REPORT_DIRECTORY=/reports \
            loader

  # ============================================================
  # Performance smoke — Foundgine warm cache
  # ============================================================
  benchmark-build-foundgine:
    name: Performance Smoke — Foundgine Warm Cache
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmark projects
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Foundgine.CoffeeBeanery.BenchmarkApi.csproj"
          )

          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      - name: Build benchmark projects
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.Database/CoffeeBeanery.Database.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/CoffeeBeanery.LoadTest/CoffeeBeanery.LoadTest.csproj"
            "src/csharp/benchmarks/CoffeeBeanery.Performance/Foundgine.CoffeeBeanery.BenchmarkApi/Foundgine.CoffeeBeanery.BenchmarkApi.csproj"
          )

          for project in "${projects[@]}"; do
            echo "Building $project"
            dotnet build "$project" --no-restore --configuration Release
          done

      - name: Pull PostgreSQL image with retry
        shell: bash
        run: |
          set -euo pipefail

          image="postgres:17-alpine"
          max_attempts=6

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Pulling $image (attempt $attempt/$max_attempts)..."

            if docker pull "$image"; then
              echo "Successfully pulled $image."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 10))
              echo "Docker registry pull failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Unable to pull $image after $max_attempts attempts." >&2
          exit 1

