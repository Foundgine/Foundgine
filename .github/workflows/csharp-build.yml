
name: csharp Build, Test & Pack

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================
  # Build and create NuGet packages
  # ============================================================
  build-pack:
    name: Build & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release tag points to main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          }

      - name: Validate canonical and release versions
        id: canon
        shell: bash
        run: |
          set -euo pipefail

          canonical="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("Directory.Build.props").getroot()
          values = [
              (element.text or "").strip()
              for element in root.iter()
              if element.tag.rsplit("}", 1)[-1] == "VersionPrefix"
          ]
          if len(values) != 1 or not values[0]:
              raise SystemExit("Expected exactly one non-empty VersionPrefix in Directory.Build.props")
          print(values[0])
          PY
          )"

          if [[ ! "$canonical" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VersionPrefix in Directory.Build.props must be MAJOR.MINOR.PATCH; found '$canonical'."
            exit 1
          fi

          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
          echo "Canonical version: $canonical"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$canonical" ]]; then
              echo "::error::Release tag v$tag_version does not match canonical version $canonical."
              exit 1
            fi
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/csharp/Foundgine.sln

      - name: Build
        run: dotnet build src/csharp/Foundgine.sln --no-restore --configuration Release

      - name: Pack NuGet packages
        shell: bash
        env:
          CANONICAL_VERSION: ${{ steps.canon.outputs.canonical }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${CANONICAL_VERSION}-ci.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "ERROR: Invalid package version: $version"
            exit 1
          fi

          echo "Package version: $version"

          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget

          dotnet pack src/csharp/Foundgine.sln --no-restore --configuration Release --output artifacts/nuget "-p:Version=$version" "-p:PackageVersion=$version"

      - name: Validate NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Available packages:"
          packages=(artifacts/nuget/*.nupkg)

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "ERROR: No NuGet packages were produced."
            exit 1
          fi

          printf '  %s\n' "${packages[@]}"

          expected_packages=(
            "Foundgine.Core"
            "Foundgine.Runtime"
            "Foundgine.Providers"
            "Foundgine.Extensions"
          )

          if [[ "${#packages[@]}" -ne "${#expected_packages[@]}" ]]; then
            echo "ERROR: Expected exactly four NuGet packages, produced ${#packages[@]}."
            exit 1
          fi

          for expected in "${expected_packages[@]}"; do
            matches=(artifacts/nuget/"${expected}".[0-9]*.nupkg)

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "ERROR: Expected exactly one package for ${expected}, found ${#matches[@]}."
              exit 1
            fi

            echo "OK: ${expected}"
          done

          for package in "${packages[@]}"; do
            filename="$(basename "$package")"
            valid=false

            for expected in "${expected_packages[@]}"; do
              if [[ "$filename" == "${expected}".[0-9]*.nupkg ]]; then
                valid=true
                break
              fi
            done

            if [[ "$valid" != true ]]; then
              echo "ERROR: Unexpected NuGet package: $filename"
              exit 1
            fi
          done

          providers_packages=(artifacts/nuget/Foundgine.Providers.[0-9]*.nupkg)

          if [[ "${#providers_packages[@]}" -ne 1 ]]; then
            echo "ERROR: Expected exactly one Foundgine.Providers package."
            exit 1
          fi

          package="${providers_packages[0]}"

          echo "Validating package: $package"

          unzip -t "$package"

          entries="$(unzip -Z1 "$package")"

          required=(
            "lib/net10.0/Foundgine.Providers.dll"
            "lib/net10.0/Foundgine.Providers.Orm.dll"
            "lib/net10.0/Foundgine.Providers.EntityFrameworkCore.dll"
            "lib/net10.0/Foundgine.Providers.Redis.dll"
            "lib/net10.0/Foundgine.Providers.AgentFramework.dll"
            "lib/net10.0/Foundgine.Providers.PostgresVector.dll"
            "lib/net10.0/Foundgine.Providers.Elasticsearch.dll"
            "analyzers/dotnet/cs/Foundgine.Providers.Aot.Generator.dll"
            "analyzers/dotnet/cs/Foundgine.Providers.Orm.Generator.dll"
            "README.md"
            "LICENSE/LICENSE"
          )

          for file in "${required[@]}"; do
            if ! grep -Fxq "$file" <<< "$entries"; then
              echo "ERROR: Required package asset is missing: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          if grep -Eq '^lib/[^/]+/Foundgine\.Providers\.(Aot|Orm)\.Generator\.dll$' <<< "$entries"; then
            echo "ERROR: A Foundgine generator was incorrectly packaged as a runtime library."
            exit 1
          fi

          runtime_dlls="$(grep -E '^lib/net10\.0/[^/]+\.dll$' <<< "$entries" | sed 's#^lib/net10.0/##' | sort)"
          expected_runtime_dlls="$(printf '%s\n' \
            'Foundgine.Providers.AgentFramework.dll' \
            'Foundgine.Providers.Elasticsearch.dll' \
            'Foundgine.Providers.EntityFrameworkCore.dll' \
            'Foundgine.Providers.Orm.dll' \
            'Foundgine.Providers.PostgresVector.dll' \
            'Foundgine.Providers.Redis.dll' \
            'Foundgine.Providers.dll' | sort)"
          if [[ "$runtime_dlls" != "$expected_runtime_dlls" ]]; then
            echo "ERROR: Unexpected runtime DLL set in Foundgine.Providers package."
            echo "Found:"
            printf '%s\n' "$runtime_dlls"
            exit 1
          fi

          nuspec="$(unzip -p "$package" Foundgine.Providers.nuspec)"
          python3 - "$nuspec" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.fromstring(sys.argv[1])
          dependencies = {
              item.attrib.get("id", "")
              for item in root.iter()
              if item.tag.rsplit("}", 1)[-1] == "dependency"
          }
          required = {
              "Microsoft.EntityFrameworkCore",
              "Microsoft.EntityFrameworkCore.Relational",
              "Microsoft.Extensions.DependencyInjection.Abstractions",
          }
          missing = sorted(required - dependencies)
          if missing:
              raise SystemExit("Missing NuGet dependencies: " + ", ".join(missing))
          print("OK: EF Core dependencies declared in nuspec")
          PY

          if grep -Eq '^lib/[^/]+/(Microsoft\.EntityFrameworkCore|Microsoft\.Extensions\.DependencyInjection)[^/]*\.dll$' <<< "$entries"; then
            echo "ERROR: Third-party EF Core/DI DLL was bundled instead of declared as a dependency."
            exit 1
          fi

          for candidate in "${packages[@]}"; do
            filename="$(basename "$candidate")"

            if [[ "$filename" == Foundgine.Providers.Aot.Generator.*.nupkg ]]; then
              echo "ERROR: A separate AOT generator NuGet package was produced."
              exit 1
            fi
          done

          # The Extensions package bundles the GraphQL, Temporal and Keycloak assemblies and depends on Foundgine.Providers.
          extensions_packages=(artifacts/nuget/Foundgine.Extensions.[0-9]*.nupkg)
          extensions_entries="$(unzip -Z1 "${extensions_packages[0]}")"
          for assembly in Foundgine.Extensions.GraphQL Foundgine.Extensions.Temporal Foundgine.Extensions.Keycloak; do
            if ! grep -Fxq "lib/net10.0/${assembly}.dll" <<< "$extensions_entries"; then
              echo "ERROR: Foundgine.Extensions package does not contain lib/net10.0/${assembly}.dll"
              exit 1
            fi
            echo "OK: Foundgine.Extensions carries ${assembly}"
          done
          extensions_nuspec="$(unzip -p "${extensions_packages[0]}" Foundgine.Extensions.nuspec)"
          if ! grep -q 'id="Foundgine.Providers"' <<< "$extensions_nuspec"; then
            echo "ERROR: Foundgine.Extensions must declare a dependency on Foundgine.Providers."
            exit 1
          fi

          if compgen -G "artifacts/nuget/Foundgine.Experimental.Aot.*.nupkg" > /dev/null; then
            echo "ERROR: Obsolete Foundgine.Experimental.Aot package was produced."
            exit 1
          fi

          echo "OK: exactly four expected NuGet packages"
          echo "OK: AOT generator included as a compiler analyzer"
          echo "OK: no separate AOT generator package"
          echo "OK: no obsolete Experimental.Aot package"

          echo "NuGet package validation passed."

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

  # ============================================================
  # Unit tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    needs:
      - build-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/csharp/Foundgine.sln

      - name: Build
        run: dotnet build src/csharp/Foundgine.sln --no-restore --configuration Release

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          # These suites are executed in dedicated jobs.
          exclude=(
            "src/csharp/tests/Foundgine.E2E.Tests/Foundgine.E2E.Tests.csproj"
            "src/csharp/tests/Foundgine.EventStore.Tests/Foundgine.EventStore.Tests.csproj"
            "src/csharp/tests/Foundgine.Redis.Tests/Foundgine.Redis.Tests.csproj"
            "src/csharp/benchmarks/AgentEndToEnd/Fixtures/SupplyChain.PenTest/Tests/Foundgine.SupplyChain.PenTest.Tests.csproj"
            "src/csharp/benchmarks/AgentEndToEnd/Fixtures/SupplyChain.Layered/Tests/Foundgine.SupplyChain.Tests.csproj"
            "src/csharp/samples/Foundgine.SupplyChain.Advanced/Semantic/Tests/Foundgine.SupplyChain.Advanced.Tests.csproj"
          )

          mapfile -t all_tests < <(find src/csharp -name '*.Tests.csproj' | sort)

          if [[ "${#all_tests[@]}" -eq 0 ]]; then
            echo "ERROR: No test projects were found."
            exit 1
          fi

          status=0

          for project in "${all_tests[@]}"; do
            skip=false

            for ex in "${exclude[@]}"; do
              if [[ "$project" == "$ex" ]]; then
                skip=true
                break
              fi
            done

            if [[ "$skip" == true ]]; then
              echo "Skipping dedicated test project: $project"
              continue
            fi

            echo "::group::dotnet test $project"

            dotnet test "$project" \
              --no-build \
              --configuration Release \
              --logger "console;verbosity=normal" || status=$?

            echo "::endgroup::"
          done

          exit "$status"

