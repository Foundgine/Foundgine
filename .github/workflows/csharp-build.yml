            src/csharp/benchmarks/AgentEndToEnd/Fixtures/SupplyChain.PenTest/Tests/Foundgine.SupplyChain.PenTest.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter 'FullyQualifiedName~GraphPenetrationTests' \
            --results-directory artifacts/pentest/security-penetration-graph \
            --logger "trx;LogFileName=security-penetration-graph-1.trx" \
            --logger 'console;verbosity=normal'

      - name: Teardown isolated database
        if: always()
        run: |
          docker compose \
            -f src/csharp/benchmarks/AgentEndToEnd/Fixtures/SupplyChain.PenTest/docker-compose.yml \
            down --volumes --remove-orphans

      - name: Upload penetration test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-penetration-graph-results
          path: artifacts/pentest/security-penetration-graph/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify penetration tests executed
        shell: bash
        run: |
          set -euo pipefail
          # Guard against a silent zero-test pass: at least one TRX must exist and tests must have executed.
          python3 - security-penetration-graph <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          job = sys.argv[1]
          files = glob.glob(f"artifacts/pentest/{job}/*.trx")
          if not files:
              print(f"::error::No TRX results were produced for {job}; the penetration tests did not run.")
              sys.exit(1)

          failed = False
          for f in sorted(files):
              counters = None
              for el in ET.parse(f).getroot().iter():
                  if el.tag.rsplit("}", 1)[-1] == "Counters":
                      counters = el
                      break
              total = int(counters.get("total", 0)) if counters is not None else 0
              executed = int(counters.get("executed", 0)) if counters is not None else 0
              print(f"{f}: {executed} executed of {total}")
              if executed == 0:
                  print(f"::error::{f} executed no tests (all skipped or none discovered).")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

